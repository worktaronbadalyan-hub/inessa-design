const LIME="#C6F03C",DARK="#0E0E0E",LIGHT="#F0F0EE",WHITE="#fff",INK="#111";
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function wrap(c,t,f,mw){c.font=f;let ws=t.split(" "),ls=[],cur="";for(const w of ws){let tt=(cur+" "+w).trim();if(c.measureText(tt).width<=mw)cur=tt;else{if(cur)ls.push(cur);cur=w}}if(cur)ls.push(cur);return ls;}
function arm(w,s){return w+" "+s+"px 'Noto Sans Armenian'";}
function glow(c,x,y,r,a){let g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,"rgba(198,240,60,"+a+")");g.addColorStop(1,"rgba(198,240,60,0)");c.fillStyle=g;c.fillRect(0,0,2000,2000);}
function halftone(c,x0,y0,x1,y1,col){c.fillStyle=col;for(let y=y0;y<y1;y+=24)for(let x=x0;x<x1;x+=24){c.beginPath();c.arc(x,y,2,0,7);c.fill();}}
function arrow(c,cx,cy,r){c.fillStyle=LIME;c.beginPath();c.arc(cx,cy,r,0,7);c.fill();c.strokeStyle=DARK;c.lineWidth=9;c.lineCap="round";let a=r*0.9;c.beginPath();c.moveTo(cx-a*0.4,cy);c.lineTo(cx+a*0.42,cy);c.moveTo(cx+a*0.08,cy-a*0.34);c.lineTo(cx+a*0.42,cy);c.moveTo(cx+a*0.08,cy+a*0.34);c.lineTo(cx+a*0.42,cy);c.stroke();}
function brand(c,acc,mark,fg){let x=96,y=92;if(mark){c.fillStyle=LIME;c.beginPath();c.moveTo(x+15,y-16);c.lineTo(x+30,y);c.lineTo(x+15,y+16);c.lineTo(x,y);c.closePath();c.fill();var tx=x+44;}else{c.fillStyle=LIME;c.fillRect(x,y-18,10,34);var tx=x+28;}c.fillStyle=fg;c.font="30px Anton";c.textBaseline="alphabetic";c.fillText(acc,tx,y+10);}
function pag(c,i,t,fg){c.fillStyle=fg;c.font="30px Anton";let s=String(i).padStart(2,"0")+"/"+String(t).padStart(2,"0");c.textAlign="right";c.fillText(s,1080-96,102);c.textAlign="left";}
function lines(c,ls,f,x,y,fill,lh){c.font=f;c.fillStyle=fill;for(const l of ls){c.fillText(l,x,y);y+=lh;}return y;}
function drawSlide(cv,car,i){
 const c=cv.getContext("2d");c.clearRect(0,0,1080,1350);

 c.fillStyle=bg;c.fillRect(0,0,1080,1350);
 glow(c,1040,40,300,dark?0.28:0.18);glow(c,60,1290,240,dark?0.18:0.12);

 c.textBaseline="alphabetic";c.textAlign="left";
 brand(c,car.account,car.mark,fg);pag(c,i+1,tot,fg);
 if(s.type==="hook"){
  let y=380;let f=arm("800",118);
  y=lines(c,wrap(c,s.title_white,f,1080-192),f,96,y,fg,132);

  arrow(c,1080-96-10,1200,52);
 }else if(s.type==="step"){

 }else{

 }

 c.fillStyle=DARK;c.fillRect(0,0,1920,1080);

 c.fillStyle=WHITE;c.font="34px Anton";c.fillText("TARON BADALYAN",x+48,y+10);
 c.fillStyle=WHITE;c.font=arm("800",76);c.fillText(kp.title,110,260);
 c.fillStyle=LIME;c.font=arm("600",40);c.fillText(kp.subtitle,110,330);
 c.fillStyle=LIME;c.fillRect(110,360,120,8);
 let n=kp.formats.length,gap=40,cw=(1920-220-(n-1)*gap)/n,cy=430,ch=500;
 for(let i=0;i<n;i++){let f=kp.formats[i],cx=110+i*(cw+gap);
  c.fillStyle="#161616";rr(c,cx,cy,cw,ch,18);c.fill();
  c.fillStyle=LIME;rr(c,cx,cy,cw,12,6);c.fill();
  c.fillStyle=LIME;c.font="60px Anton";c.fillText(f.name,cx+40,cy+110);

  c.font=fb;c.fillStyle="#d8d8d8";for(const l of ls){c.fillText(l,cx+40,ly);ly+=50;}
 }
 c.fillStyle="#8A8A8A";c.font=arm("500",30);c.fillText(kp.foot,110,1010);
 c.fillStyle=LIME;c.fillRect(1700,1000,120,10);
}

let BUILT=false;
function build(){
 if(BUILT)return;BUILT=true;
 document.getElementById("date").textContent=D.date;
 const root=document.getElementById("cars");
 for(const car of D.carousels){
  let sec=document.createElement("section");
  sec.innerHTML=`<h2>Карусель ${car.id} · ${car.account} <span>${car.handle}</span></h2>
   <p class="meta">${car.framework} · хук ${car.hook} · ${car.lang} · ${car.slides.length} слайдов</p>`;
  let row=document.createElement("div");row.className="row";
  for(let i=0;i<car.slides.length;i++)row.appendChild(slideCanvas(car,i));
  sec.appendChild(row);
  let dall=document.createElement("button");dall.className="dall";dall.textContent="Скачать все PNG ("+car.id+")";
  dall.onclick=()=>{row.querySelectorAll("canvas").forEach((cv,i)=>setTimeout(()=>dl(cv,D.date+"_"+car.id+"_"+String(i+1).padStart(2,"0")+".png"),i*250));};
  sec.appendChild(dall);
  let det=document.createElement("details");det.innerHTML=`<summary>Подпись + alt-текст</summary><pre class="cap">${car.caption.replace(/</g,"&lt;")}</pre><p class="alt"><b>ALT:</b> ${car.alt}</p>`+(car.first_comment?`<p class="alt"><b>1-й комментарий:</b> ${car.first_comment}</p>`:"");
  sec.appendChild(det);
  root.appendChild(sec);
 }
 if(D.kp){
  let sec=document.createElement("section");
  sec.innerHTML=`<h2>Доп. задача дня · Слайд КП <span>1920×1080</span></h2><p class="meta">3 формата ИИ-тренинга (START / GROWTH / TRANSFORMATION), без цен · армянский</p>`;
  let cv=document.createElement("canvas");cv.width=1920;cv.height=1080;cv.className="kp";drawKP(cv,D.kp);
  sec.appendChild(cv);
  let b=document.createElement("button");b.className="dall";b.textContent="Скачать PNG (КП)";b.onclick=()=>dl(cv,D.date+"_KP_formats.png");
  sec.appendChild(document.createElement("br"));sec.appendChild(b);
  root.appendChild(sec);
 }
}
if(document.fonts&&document.fonts.ready){document.fonts.load("800 80px 'Noto Sans Armenian'").then(()=>document.fonts.load("600 40px 'Noto Sans Armenian'")).then(()=>document.fonts.load("40px Anton")).then(()=>document.fonts.ready).then(build);setTimeout(build,1500);}else build();
</script>
</body></html>
