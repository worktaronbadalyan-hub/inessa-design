<script>
const LIME="#C6F03C",DARK="#0E0E0E",LIGHT="#F0F0EE",WHITE="#fff",INK="#111";
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function wrap(c,t,f,mw){c.font=f;let ws=t.split(" "),ls=[],cur="";for(const w of ws){let tt=(cur+" "+w).trim();if(c.measureText(tt).width<=mw)cur=tt;else{if(cur)ls.push(cur);cur=w}}if(cur)ls.push(cur);return ls;}
function arm(w,s){return w+" "+s+"px 'Noto Sans Armenian'";}
function glow(c,x,y,r,a){let g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,"rgba(198,240,60,"+a+")");g.addColorStop(1,"rgba(198,240,60,0)");c.fillStyle=g;c.fillRect(0,0,1080,2000);}
function halftone(c,x0,y0,x1,y1,col){c.fillStyle=col;for(let y=y0;y<y1;y+=24)for(let x=x0;x<x1;x+=24){c.beginPath();c.arc(x,y,2,0,7);c.fill();}}
function arrow(c,cx,cy,r){c.fillStyle=LIME;c.beginPath();c.arc(cx,cy,r,0,7);c.fill();c.strokeStyle=DARK;c.lineWidth=9;c.lineCap="round";let a=r*0.9;c.beginPath();c.moveTo(cx-a*0.4,cy);c.lineTo(cx+a*0.42,cy);c.moveTo(cx+a*0.08,cy-a*0.34);c.lineTo(cx+a*0.42,cy);c.moveTo(cx+a*0.08,cy+a*0.34);c.lineTo(cx+a*0.42,cy);c.stroke();}
function brand(c,acc,mark,fg){let x=96,y=92;if(mark){c.fillStyle=LIME;c.beginPath();c.moveTo(x+15,y-16);c.lineTo(x+30,y);c.lineTo(x+15,y+16);c.lineTo(x,y);c.closePath();c.fill();var tx=x+44;}else{c.fillStyle=LIME;c.fillRect(x,y-18,10,34);var tx=x+28;}c.fillStyle=fg;c.font="30px Anton";c.textBaseline="alphabetic";c.fillText(acc,tx,y+10);}
function pag(c,i,t,fg){c.fillStyle=fg;c.font="30px Anton";let s=String(i).padStart(2,"0")+"/"+String(t).padStart(2,"0");c.textAlign="right";c.fillText(s,1080-96,102);c.textAlign="left";}
function lines(c,ls,f,x,y,fill,lh){c.font=f;c.fillStyle=fill;for(const l of ls){c.fillText(l,x,y);y+=lh;}return y;}
function drawSlide(cv,car,i){
 const c=cv.getContext("2d");c.clearRect(0,0,1080,1350);
 const s=car.slides[i],dark=s.bg==="dark",fg=dark?WHITE:INK,bg=dark?DARK:LIGHT,tot=car.slides.length;
 c.fillStyle=bg;c.fillRect(0,0,1080,1350);
 glow(c,1040,40,300,dark?0.28:0.18);glow(c,60,1290,240,dark?0.18:0.12);
 halftone(c,830,1100,1010,1280,dark?"#2A2A2A":"#DADAD6");
 c.textBaseline="alphabetic";c.textAlign="left";
 brand(c,car.account,car.mark,fg);pag(c,i+1,tot,fg);
 if(s.type==="hook"){
  let y=380;let f=arm("800",118);
  y=lines(c,wrap(c,s.title_white,f,1080-192),f,96,y,fg,132);
  y=lines(c,wrap(c,s.title_lime,f,1080-192),f,96,y+6,LIME,132);
  c.fillStyle=LIME;c.fillRect(96,y+24,70,8);
  c.font=arm("600",40);c.fillStyle=fg;c.fillText(s.sub,96,y+92);
  arrow(c,1080-96-10,1200,52);
 }else if(s.type==="step"){
  let py=300,num=/^\d+$/.test(s.step),hx=96,hy;
  if(num){c.fillStyle=LIME;c.font="150px Anton";c.fillText(s.step,96,py+118);hy=py+200;}
  else{c.font=arm("600",34);let tw=c.measureText(s.step).width,pad=28,ph=74;c.fillStyle=LIME;rr(c,96,py,tw+2*pad,ph,ph/2);c.fill();c.fillStyle=DARK;c.fillText(s.step,96+pad,py+ph/2+12);hy=py+ph+64;}
  let fh=arm("800",72);let yy=lines(c,wrap(c,s.head,fh,1080-192),fh,hx,hy,fg,84);
  c.fillStyle=LIME;c.fillRect(96,yy+10,120,6);
  let fb=arm("500",42);lines(c,wrap(c,s.body,fb,1080-192),fb,96,yy+72,fg,58);
  arrow(c,1080-96-10,1200,52);
 }else{
  let y=420,fh=arm("800",84);y=lines(c,wrap(c,s.head,fh,1080-192),fh,96,y,fg,98);
  let pf=arm("600",40),tw=(c.font=pf,c.measureText(s.pill).width),pad=40,ph=108,mw=1080-192;
  if(tw+2*pad>mw){pf=arm("600",33);c.font=pf;tw=c.measureText(s.pill).width;}
  c.fillStyle=LIME;rr(c,96,y+36,Math.min(tw+2*pad,mw),ph,ph/2);c.fill();
  c.fillStyle=DARK;c.font=pf;c.fillText(s.pill,96+pad,y+36+ph/2+14);
  let yb=y+36+ph+66;if(s.subcta){c.fillStyle=fg;c.font=arm("500",38);c.fillText(s.subcta,96,yb);}
  c.fillStyle=LIME;c.fillRect(96,1150,70,8);
  c.fillStyle=fg;c.font=car.mark?arm("600",36):"40px Anton";c.fillText(s.foot,96,1200);
 }
}
function drawCover(cv,co){
 const c=cv.getContext("2d");c.clearRect(0,0,1080,1920);
 c.fillStyle=DARK;c.fillRect(0,0,1080,1920);
 glow(c,1040,160,340,0.3);glow(c,40,1720,300,0.16);
 halftone(c,820,1300,1010,1500,"#222");
 let x=96,y=140;if(co.mark){c.fillStyle=LIME;c.beginPath();c.moveTo(x+17,y-17);c.lineTo(x+34,y);c.lineTo(x+17,y+17);c.lineTo(x,y);c.closePath();c.fill();var tx=x+48;}else{c.fillStyle=LIME;c.fillRect(x,y-18,12,34);var tx=x+30;}
 c.fillStyle=WHITE;c.font="34px Anton";c.textBaseline="alphabetic";c.fillText(co.account,tx,y+10);
 c.fillStyle=LIME;c.font="500 38px Oswald";c.fillText(co.kicker,96,y+150);
 let mw=(1080-230)-96,hy=620;
 for(const line of [co.l1,co.l2]){let fs=128;c.font="700 "+fs+"px Oswald";while(c.measureText(line).width>mw&&fs>60){fs-=4;c.font="700 "+fs+"px Oswald";}c.fillStyle=WHITE;c.fillText(line,96,hy);hy+=fs+22;}
 c.fillStyle=LIME;c.fillRect(96,hy+6,160,14);
 arrow(c,148,1250,48);c.fillStyle="#8A8A8A";c.font="500 32px Oswald";c.fillText("REELS COVER",220,1262);
}
function dl(cv,name){cv.toBlob(b=>{let a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();},"image/png");}
</script>
<script>

function slideCanvas(car,i){let cv=document.createElement("canvas");cv.width=1080;cv.height=1350;cv.className="slide";drawSlide(cv,car,i);let wrap=document.createElement("div");wrap.className="sw";wrap.appendChild(cv);let b=document.createElement("button");b.textContent="PNG "+String(i+1).padStart(2,"0");b.onclick=()=>dl(cv,D.date+"_"+car.id+"_"+String(i+1).padStart(2,"0")+".png");wrap.appendChild(b);return wrap;}
let BUILT=false;
function build(){
 if(BUILT)return;BUILT=true;
 document.getElementById("date").textContent=D.date;
 const root=document.getElementById("cars");
 for(const car of D.carousels){
  let sec=document.createElement("section");
  sec.innerHTML=`<h2>Карусель ${car.id} · ${car.account} <span>${car.handle}</span></h2>
   <p class="meta">${car.framework} · хук ${car.hook} · ${car.lang} · ${car.slides.length} слайдов</p>`;
  let row=document.createElement("div");row.className="row";
  for(let i=0;i<car.slides.length;i++)row.appendChild(slideCanvas(car,i));
  sec.appendChild(row);
  let dall=document.createElement("button");dall.className="dall";dall.textContent="Скачать все PNG ("+car.id+")";
  dall.onclick=()=>{row.querySelectorAll("canvas").forEach((cv,i)=>setTimeout(()=>dl(cv,D.date+"_"+car.id+"_"+String(i+1).padStart(2,"0")+".png"),i*250));};
  sec.appendChild(dall);
  let det=document.createElement("details");det.innerHTML=`<summary>Подпись + alt-текст</summary><pre class="cap">${car.caption.replace(/</g,"&lt;")}</pre><p class="alt"><b>ALT:</b> ${car.alt}</p>`+(car.first_comment?`<p class="alt"><b>1-й комментарий:</b> ${car.first_comment}</p>`:"");
  sec.appendChild(det);
  root.appendChild(sec);
 }
}
if(document.fonts&&document.fonts.ready){document.fonts.load("800 80px 'Noto Sans Armenian'").then(()=>document.fonts.load("40px Anton")).then(()=>document.fonts.ready).then(build);setTimeout(build,1200);}else build();
</script>
