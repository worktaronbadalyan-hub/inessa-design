<script>
const W=1080,H=1350,BLACK="#0E0E0E",LIME="#C6F03C",WHITE="#FFFFFF",OFFW="#F0F0EE";
function rnd(s){let x=s;return()=>{x=(x*16807)%2147483647;return(x-1)/2147483646}}
function parse(m){const out=[];m.split(/(\*[^*]+\*)/).forEach(c=>{if(!c)return;
 const hl=c.startsWith("*")&&c.endsWith("*")&&c.length>2;const t=hl?c.slice(1,-1):c;
 t.split(/\s+/).filter(Boolean).forEach(w=>out.push([w,hl]));});return out}
function glow(x,cx,cy,r,a){const g=x.createRadialGradient(cx,cy,0,cx,cy,r);
 g.addColorStop(0,"rgba(198,240,60,"+a+")");g.addColorStop(.45,"rgba(198,240,60,"+(a*.35)+")");
 g.addColorStop(1,"rgba(198,240,60,0)");x.fillStyle=g;x.fillRect(0,0,W,H)}
function halftone(x,x0,y0,x1,y1,col,step,mr,seed){const R=rnd(seed);
 for(let y=y0;y<y1;y+=step)for(let px=x0;px<x1;px+=step){
  const t=1-(y-y0)/Math.max(1,y1-y0);const r=mr*(.25+.75*t)*(.6+.7*R());
  const a=.8*t*(.5+.5*R());if(r>.4&&a>.03){x.globalAlpha=a;x.fillStyle=col;
  x.beginPath();x.arc(px,y,r,0,7);x.fill();}}x.globalAlpha=1}
function arcs(x,cx,cy,rs,col,a,w){x.save();x.globalAlpha=a;x.strokeStyle=col;x.lineWidth=w;
 rs.forEach(r=>{x.beginPath();x.arc(cx,cy,r,0,7);x.stroke()});x.restore()}
function bg(x,dark,seed){x.fillStyle=dark?BLACK:OFFW;x.fillRect(0,0,W,H);
 if(dark){glow(x,980,-60,620,.42);glow(x,60,1420,560,.3);
  halftone(x,800,980,1064,1240,LIME,26,4,seed);arcs(x,1030,120,[300,430,560],LIME,.18,2);}
 else{glow(x,1000,1400,620,.35);halftone(x,812,190,1064,430,"#464646",26,3.4,seed+5);
  arcs(x,40,1290,[280,400,520],"#141414",.1,2);}}
function header(x,i,n,dark){const fg=dark?WHITE:BLACK;
 x.fillStyle=LIME;x.beginPath();x.roundRect(84,78,38,38,10);x.fill();
 x.fillStyle="#0E0E0E";x.beginPath();x.roundRect(94,88,18,18,4);x.fill();
 x.font="700 24px Archivo";x.fillStyle=fg;x.textBaseline="top";x.fillText("TARON BADALYAN",136,86);
 x.font="700 23px Archivo";const cur=String(i).padStart(2,"0"),tot="/"+String(n).padStart(2,"0");
 const wt=x.measureText(tot).width,wc=x.measureText(cur).width;
 x.fillStyle=LIME;x.fillText(cur,W-84-wt-wc,87);
 x.fillStyle=dark?"#969696":"#6e6e6e";x.fillText(tot,W-84-wt,87);
 x.strokeStyle=dark?"#343434":"#cdcdca";x.lineWidth=1;
 x.beginPath();x.moveTo(84,140.5);x.lineTo(W-84,140.5);x.stroke()}
function arrowC(x,cx,cy,r){x.fillStyle=LIME;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();
 const L=r*.46;x.strokeStyle="#0E0E0E";x.lineWidth=5;x.lineCap="round";
 x.beginPath();x.moveTo(cx-L,cy);x.lineTo(cx+L,cy);
 x.moveTo(cx+L-12,cy-12);x.lineTo(cx+L,cy);x.moveTo(cx+L-12,cy+12);x.lineTo(cx+L,cy);x.stroke()}
function pillBtn(x,px,py,t){x.font="700 28px Archivo";const w=x.measureText(t).width+118,h=74;
 x.fillStyle=LIME;x.beginPath();x.roundRect(px,py,w,h,h/2);x.fill();
 x.fillStyle="#0E0E0E";x.textBaseline="middle";x.fillText(t,px+40,py+h/2+1);x.textBaseline="top";
 const ax=px+w-44,cy=py+h/2;x.strokeStyle="#0E0E0E";x.lineWidth=4;x.lineCap="round";
 x.beginPath();x.moveTo(ax-16,cy);x.lineTo(ax+16,cy);x.moveTo(ax+4,cy-11);x.lineTo(ax+16,cy);
 x.moveTo(ax+4,cy+11);x.lineTo(ax+16,cy);x.stroke()}
function footer(x,dark,last){const fg=dark?WHITE:BLACK;
 if(last){pillBtn(x,84,1160,"FOLLOW");x.font="400 26px Archivo";
  x.fillStyle=dark?"#a0a0a0":"#5f5f5f";x.fillText("@taronbadalyan  ·  The Voice of Stone",84,1268);}
 else{arrowC(x,126,1202,42);x.font="700 26px Archivo";x.fillStyle=fg;x.fillText("SWIPE",192,1188);
  x.font="400 22px Archivo";x.fillStyle=dark?"#8c8c8c":"#6e6e6e";x.fillText("keep reading",192,1222);}}
function lay(x,words,maxw){const L=[];let c=[];
 words.forEach(([w,h])=>{const t=c.concat([[w,h]]).map(a=>a[0]).join(" ");
  if(c.length&&x.measureText(t).width>maxw){L.push(c);c=[[w,h]]}else c.push([w,h])});
 if(c.length)L.push(c);return L}
function head(x,m,px,py,maxw,size,dark,maxl){const words=parse(m);let sz=size,L;
 for(;sz>40;sz-=4){x.font=sz+"px Anton";L=lay(x,words,maxw);
  if(L.length<=maxl&&L.every(l=>x.measureText(l.map(a=>a[0]).join(" ")).width<=maxw))break}
 x.font=sz+"px Anton";L=lay(x,words,maxw);const step=Math.round(sz*1.02);
 const sp=x.measureText(" ").width;let cy=py;
 L.forEach(l=>{let cx=px;l.forEach(([w,h])=>{x.fillStyle=h?LIME:(dark?WHITE:BLACK);
  x.fillText(w,cx,cy);cx+=x.measureText(w).width+sp});cy+=step});
 return py+(L.length-1)*step+sz*1.02}
function body(x,t,px,py,maxw,size,dark){x.font="400 "+size+"px Archivo";
 const L=lay(x,t.split(/\s+/).map(w=>[w,0]),maxw);const step=Math.round(size*1.42);
 x.fillStyle=dark?"#c4c4c4":"#444";L.forEach(l=>{x.fillText(l.map(a=>a[0]).join(" "),px,py);py+=step});return py}
function draw(cv,s,i,n){const x=cv.getContext("2d");cv.width=W;cv.height=H;x.textBaseline="top";
 const dark=s.t==="p"?!!s.dark:true;bg(x,dark,i);header(x,i,n,dark);
 if(s.t==="hook"||s.t==="cta"){
  x.font="700 25px Archivo";x.fillStyle=LIME;
  x.fillText((s.t==="cta"?"SAVE THIS":s.kicker.toUpperCase()),84,266);
  x.fillStyle=LIME;x.fillRect(84,310,70,4);
  if(s.t==="cta")arcs(x,540,720,[340,470],LIME,.14,2);
  const y=head(x,s.hook,84,366,W-168,s.t==="cta"?108:122,dark,5);
  body(x,s.sub,84,y+60,W-250,32,dark);footer(x,dark,s.t==="cta");
 }else{
  x.font="104px Anton";x.fillStyle=LIME;x.fillText(s.num,84,330);
  x.fillRect(84,474,Math.max(104,x.measureText(s.num).width),5);
  const y=head(x,s.title,84,552,W-168,100,dark,3);
  body(x,s.text,84,y+56,W-200,34,dark);footer(x,dark,false);}}
const A=[
{t:"hook",kicker:"A day in stone · behind the scenes",hook:"*6 AM.* THE QUARRY. THIS IS HOW A DAY IN STONE STARTS",sub:"People see the finished facade. They never see the twelve hours behind one single block."},
{t:"p",num:"06:00",dark:false,title:"THE *MOUNTAIN* IS COLD",text:"Machines start before the sun. We check the wire, the water and the cut line from yesterday. A wrong line here costs us a full block."},
{t:"p",num:"09:00",dark:true,title:"THE FIRST *BLOCK* MOVES",text:"Twenty tons leave the mountain. From this moment every hour has a price: the loader, the truck, the saw and the people waiting at the factory."},
{t:"p",num:"12:00",dark:false,title:"THE FACTORY *DECIDES*",text:"We open the block and see the real stone for the first time. Colour, veins, hidden cracks. The plan for the week can change in one minute."},
{t:"p",num:"16:00",dark:true,title:"NUMBERS, NOT *FEELINGS*",text:"Orders, deadlines, square metres, delays. This is the part nobody films — and the part that decides if the client gets the stone on time."},
{t:"p",num:"20:00",dark:false,title:"THE DAY ENDS ON *PAPER*",text:"One short report: what we cut, what we shipped, what went wrong. Tomorrow starts from that page, not from memory."},
{t:"cta",hook:"THE FACADE TAKES A DAY TO ADMIRE. IT TOOK *YEARS* TO LEARN",sub:"Save this if you love how things are really made. Follow for the view from inside the quarry and the factory."}];
const B=[
{t:"hook",kicker:"Buying stone · 5 questions",hook:"*5 QUESTIONS* TO ASK YOUR STONE SUPPLIER BEFORE YOU SIGN",sub:"Ask these five and you will avoid almost every problem I have seen on real projects in fifteen years."},
{t:"p",num:"01",dark:false,title:"IS IT YOUR *OWN* QUARRY?",text:"A trader can lose your colour halfway through the order. A producer with its own quarry can cut the same stone again next month."},
{t:"p",num:"02",dark:true,title:"CAN I SEE THE *WHOLE BATCH?*",text:"One perfect sample proves nothing. Ask for photos of the full lot. Natural stone is a range of colours, not a single tone."},
{t:"p",num:"03",dark:false,title:"WHAT ARE THE *TEST RESULTS?*",text:"Water absorption, density, frost resistance, strength. A serious supplier sends the technical sheet in a day, not in a week."},
{t:"p",num:"04",dark:true,title:"WHO PAYS FOR *BREAKAGE?*",text:"Stone travels thousands of kilometres. Put packing, transport damage and replacement in writing before the first truck is loaded."},
{t:"p",num:"05",dark:false,title:"WHAT IS THE *REAL LEAD TIME?*",text:"Quarry, cutting, drying, finishing, packing. Ask for the plan per stage. A single final date is usually a guess, not a promise."},
{t:"cta",hook:"CHEAP STONE IS NOT CHEAP. IT IS JUST PAID *LATER*",sub:"Save this before your next order and send it to the person who signs. Follow for facts from the quarry and the factory."}];
const SETS=[
 {id:"A",h:'Карусель ① — <span>6 AM. THE QUARRY. THIS IS HOW A DAY IN STONE STARTS</span>',src:"Источник темы: контент-план Мадлен, 19.08 — «Reel: Мой день — производство», хук «6 утра. Карьер. Так начинается день в камне». Переведено в сохраняемый англоязычный таймлайн-формат.",data:A},
 {id:"B",h:'Карусель ② — <span>5 QUESTIONS TO ASK YOUR STONE SUPPLIER BEFORE YOU SIGN</span>',src:"Источник темы: своя вирусная идея Инессы по алгоритмам IG — чек-лист how-to для архитекторов, девелоперов и закупщиков. Максимальная «сохраняемость» и пересылка.",data:B}];
function dl(cv,name){cv.toBlob(b=>{const a=document.createElement("a");
 a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href)},"image/png")}
document.fonts.ready.then(()=>{const app=document.getElementById("app");
 SETS.forEach(S=>{const sec=document.createElement("section");
  sec.innerHTML='<h2>'+S.h+'</h2><div class="src">'+S.src+' · 7 слайдов · 1080×1350</div>'+
   '<button class="btn" id="all'+S.id+'">⬇ Скачать все 7 PNG</button><div class="grid" id="g'+S.id+'"></div>';
  app.appendChild(sec);const g=sec.querySelector("#g"+S.id);const cvs=[];
  S.data.forEach((s,k)=>{const d=document.createElement("div");d.className="card";
   const cv=document.createElement("canvas");d.appendChild(cv);
   const nm="carousel"+S.id+"_slide"+String(k+1).padStart(2,"0")+".png";
   const a=document.createElement("a");a.href="#";a.textContent="PNG ⬇ "+(k+1)+"/7";
   a.onclick=e=>{e.preventDefault();dl(cv,nm)};d.appendChild(a);g.appendChild(d);
   draw(cv,s,k+1,S.data.length);cvs.push([cv,nm]);});
  sec.querySelector("#all"+S.id).onclick=()=>cvs.forEach(([cv,nm],j)=>setTimeout(()=>dl(cv,nm),j*350));
 });});
