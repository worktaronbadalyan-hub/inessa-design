<style>:root{--bg:#0B0B0B;--pan:#141414;--line:#262626;--lime:#C6F03C;--ink:#fff;--dim:#9a9a9a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",-apple-system,Segoe UI,Roboto,Arial,sans-serif}
a{color:var(--lime)}
header{padding:26px 30px;border-bottom:1px solid var(--line);background:#0E0E0E}
.brandrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dmk{width:22px;height:22px;background:var(--lime);transform:rotate(45deg);border-radius:4px}
h1{font-family:"Anton";font-weight:400;font-size:24px;letter-spacing:.5px;margin:0}

.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:620px){.row{grid-template-columns:1fr}}
.cell{display:flex;flex-direction:column;gap:9px}
.cvwrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#000;aspect-ratio:1080/1920}
canvas{width:100%;display:block}
.meta{color:var(--dim);font-size:12px;line-height:1.5}
.btn{appearance:none;border:1px solid var(--lime);background:transparent;color:var(--lime);font-family:"Archivo";font-weight:700;font-size:13px;padding:9px 0;border-radius:8px;cursor:pointer;letter-spacing:.3px}
.btn:hover{background:var(--lime);color:#111}

<body>
<header><div class="brandrow"><div class="dmk"></div><h1>INESSA — ОБЛОЖКИ REELS 9:16</h1>

<div class="sub">Taron Badalyan · «The Voice of Stone» · <b>10.10.2026</b> · 1080×1920, текст в верхней зоне (выше нижнего UI reels). Нажмите «PNG», чтобы скачать.</div></header>
<div class="wrap"><div class="row" id="app"></div></div>
<div class="foot">Сгенерировано Инессой. Рендер на &lt;canvas&gt; 1080×1920, Anton / Archivo. Обложки ведут на одноимённые карусели дня.</div>
<script>var DATA={"date":"2026-10-10","covers":[
{"id":"A","seg":"STONE QUALITY","lines":["SPOT A WEAK SLAB","BEFORE IT SHIPS"],"accent":1,"size":126,"sub":["Five checks that need only your eyes.","Full carousel on the page."],"from":"к карусели A (Value-Stack / признаки)"},
{"id":"B","seg":"HOW IT IS MADE","lines":["ROUGH BLOCK","TO A MIRROR"],"accent":1,"size":140,"sub":["The shine is ground in, not sprayed.","Save the full list."],"from":"к карусели B (Demo / полировка)"}
]};
var LIME='#C6F03C',DARK='#0E0E0E',WHITE='#fff',DIM='#b8b8b8',BK='#111',M=84,W=1080,H=1920;
function FN(w,s,f){return (w?w+' ':'')+s+'px "'+f+'"';}
function tw(c,t){return c.measureText(t).width;}
function trk(c,x,y,t,fill,ls){c.save();c.letterSpacing=ls+'px';c.fillStyle=fill;c.textBaseline='top';c.fillText(t,x,y);c.restore();}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function glow(c,cx,cy,r,a){var g=c.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,'rgba(198,240,60,'+a+')');g.addColorStop(1,'rgba(198,240,60,0)');c.fillStyle=g;c.fillRect(0,0,W,H);}
function halftone(c,x0,y0,x1,y1,maxa){var step=27,nx=Math.floor((x1-x0)/step),ny=Math.floor((y1-y0)/step);for(var i=0;i<=nx;i++)for(var j=0;j<=ny;j++){var t=((i/Math.max(nx,1))+((ny-j)/Math.max(ny,1)))/2,rad=1.2+t*6,a=maxa*t;c.fillStyle='rgba(198,240,60,'+a+')';c.beginPath();c.arc(x0+i*step,y0+j*step,rad,0,7);c.fill();}}
function pill(c,x,y,t,size,fg,bg,padx,pady){c.font=FN('700',size,'Archivo');var w=tw(c,t)+padx*2,h=size+pady*2;rr(c,x,y,w,h,h/2);c.fillStyle=bg;c.fill();c.fillStyle=fg;c.textBaseline='middle';c.fillText(t,x+padx,y+h/2+1);c.textBaseline='top';}
function draw(c,s){c.fillStyle=DARK;c.fillRect(0,0,W,H);glow(c,W+40,-60,560,0.20);glow(c,-80,H*0.42,620,0.13);halftone(c,W-380,H-1100,W-30,H-820,0.30);
var lx=M,ly=86;c.fillStyle=LIME;rr(c,lx,ly,40,40,10);c.fill();c.fillStyle=DARK;c.beginPath();c.moveTo(lx+11,ly+30);c.lineTo(lx+20,ly+9);c.lineTo(lx+29,ly+30);c.closePath();c.fill();c.font=FN('700',27,'Archivo');trk(c,lx+58,ly+8,'TARON BADALYAN',WHITE,1.3);
pill(c,M,250,s.seg,26,BK,LIME,30,16);
c.font=FN('400',s.size,'Anton');c.textBaseline='top';var y=470;for(var i=0;i<s.lines.length;i++){c.fillStyle=i==s.accent?LIME:WHITE;c.fillText(s.lines[i],M,y);y+=Math.round(s.size*1.02);}
y+=30;c.strokeStyle=LIME;c.lineWidth=8;c.beginPath();c.moveTo(M,y);c.lineTo(M+140,y);c.stroke();y+=40;
c.font=FN('500',44,'Archivo');c.fillStyle=DIM;for(var j=0;j<s.sub.length;j++){c.fillText(s.sub[j],M,y);y+=58;}
c.font=FN('700',40,'Archivo');c.fillStyle=LIME;c.fillText('The Voice of Stone',M,1250);}
function dl(cv,n){cv.toBlob(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1500);},'image/png');}
var app=document.getElementById('app');
function build(){DATA.covers.forEach(function(s){var cell=document.createElement('div');cell.className='cell';
var cw=document.createElement('div');cw.className='cvwrap';var cv=document.createElement('canvas');cv.width=1080;cv.height=1920;cw.appendChild(cv);
var mt=document.createElement('div');mt.className='meta';mt.textContent='Обложка '+s.id+' — '+s.from;
var b=document.createElement('button');b.className='btn';var nm='COVER_'+s.id+'_'+DATA.date+'.png';b.textContent='↓ PNG '+s.id+' (1080×1920)';b.onclick=function(){dl(cv,nm);};
cell.appendChild(cw);cell.appendChild(mt);cell.appendChild(b);app.appendChild(cell);
var ctx=cv.getContext('2d');cv._nm=nm;cv._d=function(){draw(ctx,s);};cv._d();});}
function redraw(){document.querySelectorAll('canvas').forEach(function(c){if(c._d)c._d();});}
Promise.all([document.fonts.load('400 120px "Anton"'),document.fonts.load('500 40px "Archivo"'),document.fonts.load('700 30px "Archivo"')]).then(build).catch(build);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redraw);
</script></body></html>
