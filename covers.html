<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INESSA · Обложки Reels 9:16 · 06.10.2026</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0B;--pan:#141414;--line:#262626;--lime:#C6F03C;--ink:#fff;--dim:#9a9a9a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",-apple-system,Segoe UI,Roboto,Arial,sans-serif}
a{color:var(--lime)}
header{padding:26px 30px;border-bottom:1px solid var(--line);background:#0E0E0E}
.brandrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dmk{width:22px;height:22px;background:var(--lime);transform:rotate(45deg);border-radius:4px}
h1{font-family:"Anton";font-weight:400;font-size:26px;letter-spacing:.5px;margin:0;line-height:1}
.sub{color:var(--dim);font-size:13px;margin-top:8px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:26px 24px 60px}
.car{background:var(--pan);border:1px solid var(--line);border-radius:16px;padding:20px 20px 24px;margin-bottom:26px}
.car h2{font-family:"Anton";font-weight:400;font-size:22px;margin:0 0 4px;letter-spacing:.4px}
.car .hook{color:var(--lime);font-size:14px;font-weight:600;margin:0 0 6px}
.car .src{color:var(--dim);font-size:12px;margin:0 0 16px;line-height:1.5}
.cap{color:#cfcfcf;font-size:12.5px;line-height:1.6;background:#0E0E0E;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 16px;white-space:pre-wrap}
.cap b{color:#fff}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.row{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.row{grid-template-columns:1fr 1fr}}
.cell{display:flex;flex-direction:column;gap:7px}
.cvwrap{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000;aspect-ratio:1080/1350}
.cvwrap.rl{aspect-ratio:1080/1920}
canvas{width:100%;display:block}
.btn{appearance:none;border:1px solid var(--lime);background:transparent;color:var(--lime);font-family:"Archivo";font-weight:700;font-size:12px;padding:7px 0;border-radius:8px;cursor:pointer;letter-spacing:.3px}
.btn:hover{background:var(--lime);color:#111}
.btn.solid{background:var(--lime);color:#111}
.tools{display:flex;gap:10px;margin:2px 0 16px;flex-wrap:wrap}
.tools .btn{padding:9px 16px;font-size:13px}
.foot{color:var(--dim);font-size:12px;line-height:1.7;border-top:1px solid var(--line);padding:18px 30px 40px;max-width:1180px;margin:0 auto}
.foot a{text-decoration:none}
.nav{margin-left:auto;font-size:13px}
.row{grid-template-columns:repeat(3,1fr)}
@media(max-width:760px){.row{grid-template-columns:1fr 1fr}}
</style></head>
<body>
<header><div class="brandrow"><div class="dmk"></div><h1>INESSA — ОБЛОЖКИ REELS 9:16</h1>
<span class="nav"><a href="index.html">← Карусели 4:5</a></span></div>
<div class="sub">Taron Badalyan · «The Voice of Stone» · 06.10.2026 · 1080×1920. Текст держится выше y≈1350 — нижняя зона под объект/видео.</div></header>
<div class="wrap"><div class="car"><div class="row" id="row"></div></div></div>
<div class="foot">Обложки под Reels/Shorts. Текстовый слой — на &lt;canvas&gt; 1080×1920, безопасная зона текста — верхние ~70%. · <a href="index.html">К каруселям</a></div>
<script>const DATA={"date": "2026-10-06", "covers": [{"theme": "dark", "top": "THE FINISH", "bottom": "DECIDES", "green": "DECIDES", "tag": "TRAVERTINE SPEC"}, {"theme": "dark", "top": "WHY STONE", "bottom": "CRACKS", "green": "CRACKS", "tag": "STONE INSTALL"}]};

const LIME='#C6F03C',DARK='#0E0E0E',LIGHT='#F0F0EE',WHITE='#ffffff',BLACK='#000000';
function tc(t){return t=='dark'?[DARK,WHITE,'#cdcdcd']:[LIGHT,'#000000','#373737'];}
function FN(w,s,f){return (w?w+' ':'')+s+'px "'+f+'"';}
function trk(ctx,x,y,txt,fill,t){ctx.save();ctx.letterSpacing=t+'px';ctx.fillStyle=fill;ctx.textBaseline='top';ctx.fillText(txt,x,y);var w=ctx.measureText(txt).width;ctx.restore();return x+w;}
function twid(ctx,txt,t){ctx.save();ctx.letterSpacing=t+'px';var w=ctx.measureText(txt).width;ctx.restore();return w;}
function glow(ctx,cx,cy,r,st,W,H){var g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,'rgba(198,240,60,'+st+')');g.addColorStop(1,'rgba(198,240,60,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function halfband(ctx,theme,W,H){var col=theme=='dark'?'255,255,255':'0,0,0',al=theme=='dark'?0.09:0.06,dot=5,gap=30;ctx.fillStyle='rgba('+col+','+al+')';for(var y=H-300;y<H;y+=gap)for(var x=0;x<W;x+=gap){ctx.beginPath();ctx.arc(x,y,dot/2,0,7);ctx.fill();}}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function logo(ctx,theme,ink){var x=72,y=70,m=40,cx=x+m/2,cy=y+m/2;ctx.fillStyle=LIME;ctx.beginPath();ctx.moveTo(cx,y);ctx.lineTo(x+m,cy-6);ctx.lineTo(cx+8,y+m);ctx.lineTo(cx-8,y+m);ctx.lineTo(x,cy-6);ctx.closePath();ctx.fill();ctx.strokeStyle=theme=='dark'?DARK:LIGHT;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx,y);ctx.lineTo(cx-8,y+m);ctx.moveTo(cx,y);ctx.lineTo(cx+8,y+m);ctx.stroke();ctx.font=FN('700',30,'Archivo');trk(ctx,x+m+22,y-2,'TARON BADALYAN',ink,0.3);ctx.font=FN('600',18,'Archivo');trk(ctx,x+m+22,y+30,'THE VOICE OF STONE',LIME,0.5);}
function pageno(ctx,i,theme,ink,W){ctx.font=FN('700',30,'Archivo');var t=('0'+i).slice(-2)+'/07',w=ctx.measureText(t).width;ctx.fillStyle=ink;ctx.textBaseline='top';ctx.fillText(t,W-72-w,78);}
function swipe(ctx,W,H){var cx=W-120,cy=H-120,r=46;ctx.fillStyle=LIME;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();ctx.font=FN('700',52,'Archivo');var g='>',w=ctx.measureText(g).width;ctx.fillStyle=DARK;ctx.textBaseline='top';ctx.fillText(g,cx-w/2,cy-34);}
function wrapS(ctx,text,maxw){var words=text.split(' '),lines=[],cur='';for(var i=0;i<words.length;i++){var t=(cur+' '+words[i]).trim();if(ctx.measureText(t).width<=maxw){cur=t;}else{if(cur)lines.push(cur);cur=words[i];}}if(cur)lines.push(cur);return lines;}
function base(ctx,theme,W,H){var bg=theme=='dark'?DARK:LIGHT;ctx.clearRect(0,0,W,H);ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);halfband(ctx,theme,W,H);glow(ctx,W-120,60,420,theme=='dark'?0.14:0.09,W,H);glow(ctx,0,H-120,360,theme=='dark'?0.12:0.07,W,H);}
function kicker(ctx,txt,filled,W){ctx.font=FN('700',filled?28:26,'Archivo');var kw=twid(ctx,txt,0)+56;if(filled){ctx.fillStyle=LIME;rr(ctx,72,250,kw,56,28);ctx.fill();trk(ctx,100,266,txt,DARK,0);}else{ctx.strokeStyle=LIME;ctx.lineWidth=3;rr(ctx,72,250,kw,56,28);ctx.stroke();trk(ctx,100,266,txt,LIME,0);}}
function drawSlide(ctx,s,idx){var W=1080,H=1350,T=tc(s.theme),bg=T[0],ink=T[1],dim=T[2];base(ctx,s.theme,W,H);logo(ctx,s.theme,ink);pageno(ctx,idx,s.theme,ink,W);
 if(s.type=='hook'){kicker(ctx,s.kicker,false,W);var size=118,lh=size+18,y=360;ctx.font=FN('400',size,'Anton');ctx.textBaseline='top';for(var i=0;i<s.head.length;i++){var ln=s.head[i];ctx.fillStyle=(s.green.indexOf(ln)>=0)?LIME:ink;ctx.fillText(ln,72,y);y+=lh;}ctx.font=FN('600',38,'Archivo');ctx.fillStyle=ink;var subl=wrapS(ctx,s.sub,W-180);for(var j=0;j<subl.length;j++){ctx.fillText(subl[j],74,y+24);y+=50;}swipe(ctx,W,H);}
 else if(s.type=='value'){kicker(ctx,s.kicker,true,W);ctx.font=FN('400',76,'Anton');ctx.textBaseline='top';var y=340;var tl=wrapS(ctx,s.title,W-150);ctx.fillStyle=ink;for(var i=0;i<tl.length;i++){ctx.fillText(tl[i],72,y);y+=86;}y+=24;ctx.font=FN('600',40,'Archivo');for(var b=0;b<s.body.length;b++){ctx.fillStyle=LIME;rr(ctx,76,y+12,22,22,5);ctx.fill();var bl=wrapS(ctx,s.body[b],W-200);ctx.fillStyle=ink;var ty=y;for(var k=0;k<bl.length;k++){ctx.fillText(bl[k],120,ty);ty+=50;}y=ty+26;}swipe(ctx,W,H);}
 else{ctx.save();ctx.globalAlpha=0.7;ctx.strokeStyle=LIME;ctx.lineWidth=6;ctx.beginPath();ctx.arc(W-60,H-320,200,Math.PI*150/180,Math.PI*300/180);ctx.stroke();ctx.restore();ctx.font=FN('400',84,'Anton');ctx.textBaseline='top';var y=400;var ll=wrapS(ctx,s.line,W-170);ctx.fillStyle=ink;for(var i=0;i<ll.length;i++){ctx.fillText(ll[i],72,y);y+=94;}y+=50;ctx.font=FN('700',44,'Archivo');var cw=ctx.measureText(s.cta).width;ctx.fillStyle=LIME;rr(ctx,72,y,cw+80,44+44,60);ctx.fill();ctx.fillStyle=DARK;ctx.textBaseline='top';ctx.fillText(s.cta,112,y+20);ctx.font=FN('600',34,'Archivo');ctx.fillStyle=ink;ctx.fillText(s.sign,72,H-180);ctx.strokeStyle=LIME;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(72,H-128);ctx.lineTo(72+360,H-128);ctx.stroke();}}
function drawCover(ctx,c){var W=1080,H=1920;ctx.clearRect(0,0,W,H);ctx.fillStyle=DARK;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,0.07)';for(var y=0;y<H;y+=34)for(var x=0;x<W;x+=34){ctx.beginPath();ctx.arc(x,y,2.5,0,7);ctx.fill();}glow(ctx,W-120,80,520,0.16,W,H);glow(ctx,0,1300,460,0.12,W,H);logo(ctx,'dark',WHITE);
 ctx.font=FN('700',30,'Archivo');var kw=twid(ctx,c.tag,0)+56;ctx.strokeStyle=LIME;ctx.lineWidth=3;rr(ctx,72,520,kw,58,44);ctx.stroke();trk(ctx,100,535,c.tag,LIME,0);
 ctx.font=FN('400',150,'Anton');ctx.textBaseline='top';var y=640;var arr=[c.top,c.bottom];for(var i=0;i<arr.length;i++){ctx.fillStyle=(arr[i]==c.green)?LIME:WHITE;ctx.fillText(arr[i],72,y);y+=160;}}
function dl(cv,name){cv.toBlob(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1500);},'image/png');}

var row=document.getElementById('row');
function build(){DATA.covers.forEach(function(c,ix){
 var cell=document.createElement('div');cell.className='cell';
 var cw=document.createElement('div');cw.className='cvwrap rl';
 var cv=document.createElement('canvas');cv.width=1080;cv.height=1920;cw.appendChild(cv);
 var b=document.createElement('button');b.className='btn';b.textContent='PNG · C'+(ix+1);
 var nm='COVER_C'+(ix+1)+'_'+DATA.date+'.png';b.onclick=function(){dl(cv,nm);};
 cell.appendChild(cw);cell.appendChild(b);row.appendChild(cell);
 var ctx=cv.getContext('2d');cv._draw=function(){drawCover(ctx,c);};cv._draw();
});}
function redrawAll(){document.querySelectorAll('canvas').forEach(function(c){if(c._draw)c._draw();});}
Promise.all([document.fonts.load('400 120px "Anton"'),document.fonts.load('600 40px "Archivo"'),document.fonts.load('700 30px "Archivo"')]).then(build).catch(build);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redrawAll);
</script></body></html>
