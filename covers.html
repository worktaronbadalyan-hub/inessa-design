var LIME='#C6F03C',DARK='#0E0E0E',LIGHT='#F0F0EE',WHITE='#fff',DIMD='#969696',DIML='#6e6e6e',BK='#111';

function arrowC(c,cx,cy,r){c.fillStyle=LIME;c.beginPath();c.arc(cx,cy,r,0,7);c.fill();var s=r*0.5,lw=Math.max(5,r/9);c.strokeStyle=DARK;c.lineWidth=lw;c.lineCap='round';c.beginPath();c.moveTo(cx-s*0.7,cy);c.lineTo(cx+s*0.6,cy);c.moveTo(cx+s*0.1,cy-s*0.55);c.lineTo(cx+s*0.6,cy);c.moveTo(cx+s*0.1,cy+s*0.55);c.lineTo(cx+s*0.6,cy);c.stroke();c.lineCap='butt';}
function marker(c,cx,cy,r,good){if(good){c.fillStyle=LIME;c.beginPath();c.arc(cx,cy,r,0,7);c.fill();c.strokeStyle=BK;c.lineWidth=Math.max(4,r/4);c.lineCap='round';c.beginPath();c.moveTo(cx-r*0.45,cy+r*0.05);c.lineTo(cx-r*0.1,cy+r*0.4);c.lineTo(cx+r*0.5,cy-r*0.35);c.stroke();c.lineCap='butt';}else{c.strokeStyle='#5a5a5a';c.lineWidth=Math.max(3,r/6);c.beginPath();c.arc(cx,cy,r,0,7);c.stroke();c.beginPath();c.moveTo(cx-r*0.4,cy-r*0.4);c.lineTo(cx+r*0.4,cy+r*0.4);c.moveTo(cx-r*0.4,cy+r*0.4);c.lineTo(cx+r*0.4,cy-r*0.4);c.stroke();}}
function base(c,theme,W,H){var dark=theme=='dark';c.fillStyle=dark?DARK:LIGHT;c.fillRect(0,0,W,H);if(dark){glow(c,W+40,-40,460,0.22,W,H);glow(c,-60,H+60,520,0.17,W,H);halftone(c,W-360,H-360,W-30,H-120,'198,240,60',0.32,W,H);}else{glow(c,W+60,H+60,420,0.12,W,H);halftone(c,W-360,H-360,W-30,H-120,'120,120,120',0.24,W,H);}}

 if(s.type=='hook'){pill(c,M,172,s.seg,23,'700',BK,LIME,28,14,false);c.font=FN('400',s.size,'Anton');c.textBaseline='top';var y=300,sp=tw(c,' ');for(var i=0;i<s.lines.length;i++){var ln=s.lines[i],x=M;for(var k=0;k<ln.length;k++){c.fillStyle=ln[k][1]?LIME:ink;c.fillText(ln[k][0],x,y);x+=tw(c,ln[k][0])+sp;}y+=s.lh;}y+=46;c.font=FN('500',40,'Archivo');c.fillStyle=dim;for(var j=0;j<s.sub.length;j++){c.fillText(s.sub[j],M,y);y+=54;}arrowC(c,W-M-46,H-118,46);c.font=FN('700',24,'Archivo');c.fillStyle=ink;c.fillText('SWIPE',M,H-140);c.font=FN('500',24,'Archivo');c.fillStyle=dim;c.fillText('5 fast points',M,H-108);}
 else if(s.type=='value'){var ph=pill(c,M,196,s.tag,24,'700',BK,LIME,28,16,false)[1];c.font=FN('700',26,'Archivo');c.fillStyle=dim;c.textBaseline='middle';c.fillText(s.counter,W-M-tw(c,s.counter),196+ph/2+1);c.textBaseline='top';c.font=FN('400',s.tsize,'Anton');c.fillStyle=ink;var y=300;for(var i=0;i<s.title.length;i++){c.fillText(s.title[i],M,y);y+=Math.round(s.tsize*1.04);}y+=48;c.strokeStyle=LIME;c.lineWidth=6;c.beginPath();c.moveTo(M,y-20);c.lineTo(M+120,y-20);c.stroke();c.font=FN('500',43,'Archivo');var r=26,tx=M+r*2+34;var rows=[[s.bad,false,dim],[s.good,true,ink]];for(var q=0;q<rows.length;q++){marker(c,M+r,y+r,r,rows[q][1]);c.fillStyle=rows[q][2];var ty=y;for(var m=0;m<rows[q][0].length;m++){c.fillText(rows[q][0][m],tx,ty);ty+=56;}y=ty+42;}arrowC(c,W-M-46,H-118,46);c.font=FN('700',24,'Archivo');c.fillStyle=ink;c.fillText('KEEP SWIPING',M,H-126);}
 else{pill(c,M,196,s.kicker,23,'700',BK,LIME,28,14,false);c.font=FN('400',s.size,'Anton');c.fillStyle=ink;c.textBaseline='top';var y=320;for(var i=0;i<s.lines.length;i++){c.fillText(s.lines[i],M,y);y+=s.lh;}y+=44;pill(c,M,y,s.action,34,'700',BK,LIME,40,22,false);c.strokeStyle=LIME;c.lineWidth=3;c.beginPath();c.moveTo(M,H-170);c.lineTo(W-M,H-170);c.stroke();c.font=FN('700',30,'Archivo');c.fillStyle=ink;c.fillText(s.brandTop,M,H-142);c.font=FN('500',28,'Archivo');c.fillStyle=LIME;c.fillText(s.brandBot,M,H-104);c.fillStyle=LIME;c.beginPath();c.arc(W-M-40,H-118,40,0,7);c.fill();c.fillStyle=DARK;c.beginPath();c.moveTo(W-M-54,H-104);c.lineTo(W-M-40,H-134);c.lineTo(W-M-26,H-104);c.closePath();c.fill();}}
function drawCover(c,cv){var CW=1080,CH=1920;c.fillStyle=DARK;c.fillRect(0,0,CW,CH);c.fillStyle='rgba(255,255,255,0.06)';for(var y=0;y<CH;y+=34)for(var x=0;x<CW;x+=34){c.beginPath();c.arc(x,y,2.4,0,7);c.fill();}glow(c,CW+40,100,560,0.2,CW,CH);glow(c,-60,1500,520,0.14,CW,CH);logo(c,WHITE);pill(c,M,540,cv.tag,30,'700',LIME,LIME,30,16,true);c.font=FN('400',150,'Anton');c.textBaseline='top';var y=680,arr=[cv.top,cv.bottom];for(var i=0;i<arr.length;i++){c.fillStyle=(arr[i]==cv.green)?LIME:WHITE;c.fillText(arr[i],M,y);y+=170;}c.font=FN('600',30,'Archivo');c.fillStyle='#9a9a9a';c.fillText('TARON BADALYAN · THE VOICE OF STONE',M,CH-120);}
function dl(cv,name){cv.toBlob(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1500);},'image/png');}
