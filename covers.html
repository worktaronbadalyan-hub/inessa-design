<style>

<header><div class="brandrow"><div class="dmk"></div><h1>INESSA — ОБЛОЖКИ REELS 9:16</h1>

<div class="sub">Taron Badalyan · «The Voice of Stone» · 05.10.2026 · 1080×1920. Текст держится выше y≈1350 — нижняя зона под объект/видео.</div></header>

<div class="foot">Обложки под Reels/Shorts. Текстовый слой — на &lt;canvas&gt; 1080×1920, безопасная зона текста — верхние ~70%.</div>
<script>const DATA={"date": "2026-10-05", "covers": [{"id": "C1", "theme": "dark", "series": "HOW IT'S MADE", "head": [["QUARRY", ""], ["TO FLOOR", "g"]], "sub": "The journey of one stone block", "tag": "REEL"}, {"id": "C2", "theme": "dark", "series": "STRAIGHT TALK", "head": [["STOP PAYING", ""], ["PER METRE", "g"]], "sub": "What a stone quote really hides", "tag": "REEL"}]};
const LIME='#C6F03C',DARK='#0E0E0E',LIGHT='#F0F0EE',WHITE='#ffffff',BLACK='#111111';
function tc(t){return t=='dark'?[DARK,WHITE,'#aeaeae']:[LIGHT,BLACK,'#5c5c5c'];}
function F(w,s,fam){return (w?w+' ':'')+s+'px "'+fam+'"';}
function tw(ctx,txt,trk){ctx.save();ctx.letterSpacing=trk+'px';var w=ctx.measureText(txt).width;ctx.restore();return w;}
function trk(ctx,x,y,txt,fill,t){ctx.save();ctx.letterSpacing=t+'px';ctx.fillStyle=fill;ctx.textBaseline='top';ctx.fillText(txt,x,y);var w=ctx.measureText(txt).width;ctx.restore();return x+w;}
function glow(ctx,c,st,r,W,H){var cx,cy;if(c=='tr'){cx=W+40;cy=-40;}else if(c=='bl'){cx=-40;cy=H+40;}else if(c=='br'){cx=W+40;cy=H+40;}else{cx=-40;cy=-40;}var g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,'rgba(198,240,60,'+st+')');g.addColorStop(1,'rgba(198,240,60,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function half(ctx,c,cols,rows,gap,rmax,al,W,H){var span=(cols-1)*gap,ox,oy;if(c=='br'){ox=W-70-span;oy=H-70-span;}else if(c=='tr'){ox=W-70-span;oy=150;}else if(c=='bl'){ox=70;oy=H-70-span;}else{ox=70;oy=150;}for(var i=0;i<cols;i++)for(var j=0;j<rows;j++){var t=(i+j)/(cols+rows-2),r=rmax*(.25+.75*t),a=al*(.2+.8*t)/255;ctx.globalAlpha=a;ctx.fillStyle=LIME;ctx.beginPath();ctx.arc(ox+i*gap,oy+j*gap,r,0,7);ctx.fill();}ctx.globalAlpha=1;}
function arc(ctx,cx,cy,r,a0,a1,wd,al){ctx.save();ctx.globalAlpha=al;ctx.strokeStyle=LIME;ctx.lineWidth=wd;ctx.beginPath();ctx.arc(cx,cy,r,a0*Math.PI/180,a1*Math.PI/180);ctx.stroke();ctx.restore();}
function words(tok){var w=[],pr='';for(var k=0;k<tok.length;k++){var tx=tok[k][0],fl=tok[k][1];if(w.length&&pr&&!/ $/.test(pr)&&!/^ /.test(tx)&&".,;:!?)'’".indexOf(tx[0])<0)w.push([' ',null]);var ps=tx.split(' ');for(var q=0;q<ps.length;q++){if(ps[q]!=='')w.push([ps[q],fl]);if(q<ps.length-1)w.push([' ',null]);}pr=tx;}return w;}
function wrap(ctx,tok,maxW){var ws=words(tok),sp=ctx.measureText(' ').width,lines=[],cur=[],cw=0;for(var k=0;k<ws.length;k++){var wd=ws[k][0],fl=ws[k][1];if(wd==' '){if(cur.length){cur.push([' ',null]);cw+=sp;}continue;}var ww=ctx.measureText(wd).width;if(cw+ww>maxW&&cur.length){while(cur.length&&cur[cur.length-1][0]==' ')cur.pop();lines.push(cur);cur=[];cw=0;}cur.push([wd,fl]);cw+=ww;}if(cur.length){while(cur.length&&cur[cur.length-1][0]==' ')cur.pop();lines.push(cur);}return lines;}
function rich(ctx,tok,x,y,maxW,lh,base,align){var lines=wrap(ctx,tok,maxW);ctx.textBaseline='top';for(var i=0;i<lines.length;i++){var ln=lines[i],lw=0;for(var k=0;k<ln.length;k++)lw+=ctx.measureText(ln[k][0]).width;var cx=align=='center'?x+(maxW-lw)/2:x;for(var k=0;k<ln.length;k++){ctx.fillStyle=ln[k][1]=='g'?LIME:base;ctx.fillText(ln[k][0],cx,y);cx+=ctx.measureText(ln[k][0]).width;}y+=lh;}return y;}
function fit(ctx,tok,fam,st,mn,maxW,maxL){var s=st;while(s>mn){ctx.font=F('400',s,fam);if(wrap(ctx,tok,maxW).length<=maxL)return s;s-=3;}return mn;}
function logo(ctx,th,ink){var x=90,yy=86,s=30,cx=x+s*.5,cy=yy+16;ctx.fillStyle=LIME;ctx.beginPath();ctx.moveTo(cx,cy-s*.6);ctx.lineTo(cx+s*.52,cy);ctx.lineTo(cx,cy+s*.6);ctx.lineTo(cx-s*.52,cy);ctx.closePath();ctx.fill();ctx.fillStyle=th=='dark'?DARK:LIGHT;ctx.beginPath();ctx.moveTo(cx,cy-s*.28);ctx.lineTo(cx+s*.24,cy);ctx.lineTo(cx,cy+s*.28);ctx.lineTo(cx-s*.24,cy);ctx.closePath();ctx.fill();ctx.font=F('800',25,'Archivo');trk(ctx,x+52,yy+2,'TARON BADALYAN',ink,3);ctx.font=F('500',18,'Archivo');trk(ctx,x+52,yy+34,'THE VOICE OF STONE',th=='dark'?LIME:'#787878',4);}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawCover(ctx,cv){var W=1080,H=1920;ctx.clearRect(0,0,W,H);ctx.fillStyle=DARK;ctx.fillRect(0,0,W,H);glow(ctx,'tr',.5,820,W,H);glow(ctx,'tl',.22,620,W,H);half(ctx,'tr',8,8,34,7,120,W,H);logo(ctx,'dark',WHITE);
 ctx.font=F('800',30,'Archivo');trk(ctx,90,300,cv.series,LIME,6);var hy;if(cv.num){ctx.font=F('400',150,'Anton');ctx.fillStyle=WHITE;ctx.textBaseline='top';ctx.fillText(cv.num,90,344);hy=530;}else hy=370;
 ctx.font=F('800',24,'Archivo');var tt=cv.tag,twd=tw(ctx,tt,3)+48;ctx.fillStyle=LIME;rr(ctx,W-90-twd,300,twd,56,28);ctx.fill();trk(ctx,W-90-twd+24,313,tt,BLACK,3);
 var fs=fit(ctx,cv.head,'Anton',140,96,900,4);ctx.font=F('400',fs,'Anton');var lh=Math.round(fs*1.0);var yend=rich(ctx,cv.head,90,hy,900,lh,WHITE);
 ctx.font=F('500',38,'Archivo');rich(ctx,[[cv.sub,null]],90,Math.min(yend+40,1180),900,52,'#b4b4b4');}
function dl(cv,name){cv.toBlob(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1500);},'image/png');}

var row=document.getElementById('row');
function build(){DATA.covers.forEach(function(cv){
 var cell=document.createElement('div');cell.className='cell';
 var cw=document.createElement('div');cw.className='cvwrap';
 var c=document.createElement('canvas');c.width=1080;c.height=1920;cw.appendChild(c);
 var b=document.createElement('button');b.className='btn';b.textContent='PNG · '+cv.id;
 var nm='COVER_'+cv.id+'_'+DATA.date+'.png';b.onclick=function(){dl(c,nm);};
 cell.appendChild(cw);cell.appendChild(b);row.appendChild(cell);
 var ctx=c.getContext('2d');drawCover(ctx,cv);c._draw=function(){drawCover(ctx,cv);};
});}
function redrawAll(){document.querySelectorAll('canvas').forEach(function(c){if(c._draw)c._draw();});}
Promise.all([document.fonts.load('400 120px "Anton"'),document.fonts.load('500 40px "Archivo"'),document.fonts.load('800 25px "Archivo"')]).then(build).catch(build);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redrawAll);
</script></body></html>
