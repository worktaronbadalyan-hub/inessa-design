<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Контент-план Тарона Бадаляна · октябрь–ноябрь 2026</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:wght@400;600&display=swap">
<style>:root{
--cds-rem-scale:1;
--cds-font-size-caption:.75rem;--cds-font-size-body:.875rem;--cds-font-size-heading:.9375rem;--cds-font-size-title:1.375rem;
--cds-font-weight-medium:500;--cds-gap-xs:.5rem;--cds-gap-sm:.75rem;--cds-gap-md:1rem;--cds-gap-lg:1.75rem;
--cds-pad-xs:.375rem;--cds-pad-sm:.5rem;--cds-pad-md:.75rem;--cds-pad-lg:1rem;--cds-radius:.375rem;
--cds-dur-slow:.45s;--cds-ease-out:cubic-bezier(.165,.84,.44,1);
--font-anthropic-sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
--font-anthropic-serif:"Source Serif 4",ui-serif,Georgia,serif;
--color-bg:#1A1A19;--color-panel:#232321;--color-fg:#F1F0EA;--color-fg-muted:#A3A29B;--color-border-line:rgba(241,240,234,.13);
--color-bad:#FF7A66;--color-warn:#F2B84B;--color-ok:#8BD17C;--cds-chart-grid:rgba(241,240,234,.1);--cds-chart-muted:#5F5E5A;
--cds-surface-popover:#2D2D2A;--cds-border:rgba(241,240,234,.14);--cds-text-secondary:#A3A29B;--cds-shadow-popover:0 8px 24px #00000052,0 2px 6px #0003;color-scheme:dark} body{background:#0E0E0E;color:#F1F1EC} body{margin:0;font-family:var(--font-anthropic-sans)} #dash-root{max-width:1280px;margin:0 auto;padding:16px}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script></head>
<body><div id="dash-root">Загрузка…</div><script>
function makeDash(raw){const calcs={},D={colors:['#2A78D6','#E0703A','#1F9E6E','#B355C7','#C79A1F','#D6456B'],
calc(n,o){calcs[n]=o;},
data(n){if(raw[n])return{status:'ok',data:raw[n]};const c=calcs[n];if(c){try{return{status:'ok',data:c.fn(...(c.inputs||[]).map(i=>D.data(i).data))};}catch(e){console.error(e);return{status:'error',data:[]};}}return{status:'empty',data:[]};},
onData(cb){setTimeout(()=>{try{cb();}catch(e){console.error(e);}document.querySelectorAll('.dash-skeleton').forEach(e=>e.classList.remove('dash-skeleton'));},0);}};return D;}
(async()=>{try{const parts=await Promise.all([...Array(8).keys()].map(async i=>{const r=await fetch('t2/taron.'+i+'.bin',{cache:'no-cache'});if(!r.ok)throw new Error(r.status);return r.blob();}));const bin=new Blob(parts);
const txt=await new Response(bin.stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
const p=JSON.parse(txt);window.dash=makeDash(p.data);const root=document.getElementById('dash-root');root.innerHTML=p.html;
root.querySelectorAll('script').forEach(s=>{const n=document.createElement('script');n.textContent=s.textContent;s.replaceWith(n);});}
catch(e){document.getElementById('dash-root').textContent='Не удалось загрузить дашборд. Обновите страницу в Chrome, Safari или Edge последней версии.';console.error(e);}})();
</script></body></html>
